<!doctype html>
<!--
  Video scenes for tools/render-motion.py: 3D device mockups of the real
  screenshots in assets/. Nothing animates on its own; render(t) poses the
  scene for time t (seconds), so every frame is exact and the loop is seamless
  (all motion is periodic in the scene's duration T).

  Preview in a browser: tools/motion/scenes.html?s=showreel&play
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0E1526; }
  #stage {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    perspective: 1700px; font-family: "Archivo", system-ui, sans-serif;
    background: radial-gradient(120% 90% at 50% 115%, #1C2C5C 0%, #0E1526 62%);
  }
  .blob { position: absolute; left: 0; top: 0; border-radius: 50%; filter: blur(70px); }
  .floor {
    position: absolute; left: -10%; right: -10%; bottom: -34%; height: 62%;
    background: radial-gradient(48% 38% at 50% 30%, rgba(68, 102, 242, .28), transparent 70%);
  }
  #rig { position: absolute; inset: 0; transform-style: preserve-3d; }
  .dev, .chip { position: absolute; left: 50%; top: 50%; }
  .dev { transform-style: preserve-3d; }

  .phone {
    width: var(--w); aspect-ratio: 460 / 997;
    border-radius: calc(var(--w) * .14); padding: calc(var(--w) * .038);
    background: #050B14;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .1) inset, 0 34px 70px rgba(0, 0, 0, .6);
  }
  .phone .scr { border-radius: calc(var(--w) * .105); }
  .laptop { width: var(--w); }
  .laptop .lid {
    aspect-ratio: 16 / 10; padding: 2.1%;
    background: #0A0F1A; border-radius: 14px 14px 4px 4px;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .12) inset;
  }
  .laptop .base {
    height: calc(var(--w) * .034); margin: 0 -6%;
    background: linear-gradient(#D3D8E2, #8A93A4);
    border-radius: 0 0 16px 16px;
    box-shadow: 0 34px 70px rgba(0, 0, 0, .6);
  }
  .laptop .scr { border-radius: 3px; }
  .scr { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .scr img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 0; transform-origin: 50% 0;
  }
  .glint {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .2) 50%, transparent 62%);
  }
  .chip {
    padding: .45em 1em; border-radius: 999px; white-space: nowrap;
    font-size: var(--fs, 18px); font-weight: 600; letter-spacing: .01em; color: #E8ECF4;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .2);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  .chip::before {
    content: ""; display: inline-block; width: .5em; height: .5em; border-radius: 50%;
    margin-right: .55em; vertical-align: .08em; background: var(--dot, #6F8CFF);
  }
</style>
</head>
<body>
<div id="stage"><div class="floor"></div><div id="rig"></div></div>
<script>
const A = (name) => "../../assets/" + name + ".webp";
const COBALT = "#4466F2", TEAL = "#14A09E", SAND = "#E4A93C";

// w, h: video size; T: loop length in seconds.
// devices: x, y, z offsets from the centre (px), ry: resting turn (deg), ph: float phase.
const SCENES = {
  showreel: {
    w: 1280, h: 720, T: 9,
    devices: [
      { kind: "laptop", w: 600, x: 0, y: -14, z: 0, ry: 0, ph: 0,
        imgs: ["cm-home", "cm-listings", "cm-rental"] },
      { kind: "phone", w: 168, x: -420, y: 26, z: 90, ry: 20, ph: 1.6,
        imgs: ["soc-results", "soc-standings", "soc-calendar"] },
      { kind: "phone", w: 168, x: 420, y: 26, z: 90, ry: -20, ph: 3.4,
        imgs: ["sc-home", "sc-appt-1-doctor", "sc-urgent-3-detail"] },
    ],
    chips: [
      { t: "Flutter", x: -455, y: -250, dot: TEAL, ph: .4 },
      { t: ".NET", x: -170, y: -296, ph: 2.1 },
      { t: "Symfony", x: 175, y: -296, dot: SAND, ph: 3.3 },
      { t: "Angular", x: 470, y: -246, ph: 4.6 },
      { t: "FastAPI", x: 470, y: 278, dot: TEAL, ph: 1.2 },
      { t: "React", x: -470, y: 282, ph: 5.2 },
    ],
  },
  chalet: {
    w: 960, h: 540, T: 10,
    devices: [
      { kind: "laptop", w: 590, x: 0, y: -6, z: 0, ry: 0, ph: 0,
        imgs: ["cm-home", "cm-listings", "cm-rental", "cm-insurance"] },
    ],
    chips: [
      { t: "Symfony", x: -385, y: -186, dot: SAND, ph: .3, fs: 15 },
      { t: "Doctrine", x: 385, y: -150, ph: 2.4, fs: 15 },
      { t: "MySQL", x: 380, y: 196, dot: TEAL, ph: 4.1, fs: 15 },
    ],
  },
  soc: {
    w: 960, h: 540, T: 8,
    devices: [
      { kind: "phone", w: 168, x: -235, y: 22, z: -70, ry: 22, ph: 2.2, imgs: ["soc-standings", "soc-tickets"] },
      { kind: "phone", w: 182, x: 0, y: 0, z: 60, ry: 0, ph: 0, imgs: ["soc-results", "soc-events"] },
      { kind: "phone", w: 168, x: 235, y: 22, z: -70, ry: -22, ph: 4.1, imgs: ["soc-calendar", "soc-event-detail"] },
    ],
    chips: [
      { t: "Flutter", x: -380, y: -200, dot: TEAL, ph: .8, fs: 15 },
      { t: "GetX", x: 385, y: -190, ph: 2.9, fs: 15 },
      { t: "SQLite", x: 380, y: 206, dot: SAND, ph: 4.4, fs: 15 },
    ],
  },
  smartcare: {
    w: 960, h: 540, T: 8,
    devices: [
      { kind: "phone", w: 168, x: -235, y: 22, z: -70, ry: 22, ph: 2.2, imgs: ["sc-appt-1-doctor", "sc-appt-2-date"] },
      { kind: "phone", w: 182, x: 0, y: 0, z: 60, ry: 0, ph: 0, imgs: ["sc-home", "sc-urgent-3-detail"] },
      { kind: "phone", w: 168, x: 235, y: 22, z: -70, ry: -22, ph: 4.1, imgs: ["sc-urgent-1-list", "sc-appt-6-success"] },
    ],
    chips: [
      { t: "Flutter", x: -380, y: -200, dot: TEAL, ph: .8, fs: 15 },
      { t: "FastAPI", x: 385, y: -190, ph: 2.9, fs: 15 },
      { t: "AWS", x: 380, y: 206, dot: SAND, ph: 4.4, fs: 15 },
    ],
  },
};

const params = new URLSearchParams(location.search);
const S = SCENES[params.get("s") || "showreel"];
const stage = document.getElementById("stage");
const rig = document.getElementById("rig");

const blobs = [
  { c: COBALT, r: .55, cx: .28, cy: .3, ph: 0, o: .5 },
  { c: TEAL, r: .45, cx: .78, cy: .62, ph: 2.1, o: .32 },
  { c: SAND, r: .35, cx: .5, cy: .95, ph: 4.2, o: .22 },
].map((b) => {
  const el = document.createElement("div");
  el.className = "blob";
  const size = b.r * S.w;
  Object.assign(el.style, { width: size + "px", height: size + "px", background: b.c, opacity: b.o });
  stage.insertBefore(el, rig);
  return Object.assign(b, { el, size });
});

const devices = S.devices.map((d) => {
  const el = document.createElement("div");
  el.className = "dev";
  el.style.setProperty("--w", d.w + "px");
  const body = document.createElement("div");
  body.className = d.kind;
  const scr = document.createElement("div");
  scr.className = "scr";
  const imgs = d.imgs.map((n) => {
    const img = new Image();
    img.src = A(n);
    scr.appendChild(img);
    return img;
  });
  const glint = document.createElement("div");
  glint.className = "glint";
  scr.appendChild(glint);
  if (d.kind === "laptop") {
    const lid = document.createElement("div");
    lid.className = "lid";
    lid.appendChild(scr);
    const base = document.createElement("div");
    base.className = "base";
    body.append(lid, base);
  } else {
    body.appendChild(scr);
  }
  el.appendChild(body);
  rig.appendChild(el);
  return Object.assign({}, d, { el, imgs, glint });
});

const chips = S.chips.map((c) => {
  const el = document.createElement("div");
  el.className = "chip";
  el.textContent = c.t;
  if (c.dot) el.style.setProperty("--dot", c.dot);
  if (c.fs) el.style.setProperty("--fs", c.fs + "px");
  rig.appendChild(el);
  return Object.assign({}, c, { el });
});

const smooth = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };

// Pose everything for time t. Each screen shows its images in turn: a slow
// push-in, a crossfade into the next during the last 12% of a slot, and a glint
// across the glass as a slot begins.
function render(t) {
  const a = (2 * Math.PI * t) / S.T;
  rig.style.transform = "rotateX(" + (5 + 1.6 * Math.sin(a)).toFixed(3) + "deg) rotateY(" + (7 * Math.sin(a + .6)).toFixed(3) + "deg)";

  blobs.forEach((b) => {
    const x = b.cx * S.w - b.size / 2 + .07 * S.w * Math.cos(a + b.ph);
    const y = b.cy * S.h - b.size / 2 + .06 * S.h * Math.sin(a + b.ph);
    b.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px)";
  });

  devices.forEach((d, di) => {
    const fy = 10 * Math.sin(2 * a + d.ph);
    const ry = d.ry + 3 * Math.sin(a + d.ph);
    d.el.style.transform = "translate(-50%,-50%) translate3d(" + d.x + "px," + (d.y + fy).toFixed(2) + "px," + d.z + "px) rotateY(" + ry.toFixed(3) + "deg)";

    const n = d.imgs.length;
    // devices change screens at staggered moments, never all at once
    const pos = ((t / S.T) * n + di * .38) % n;
    const i = Math.floor(pos), f = pos - i, next = (i + 1) % n;
    const fade = smooth((f - .88) / .12);
    d.imgs.forEach((img, k) => {
      let op = 0, z = 0, sc = 1;
      if (k === i) { op = 1; z = 1; sc = 1 + .045 * f; }
      if (k === next && n > 1) { op = fade; z = 2; sc = 1; }
      img.style.opacity = op;
      img.style.zIndex = z;
      img.style.transform = "scale(" + sc.toFixed(4) + ")";
    });
    const g = f < .28 ? -120 + 240 * (f / .28) : 120;
    d.glint.style.transform = "translateX(" + g.toFixed(1) + "%)";
  });

  chips.forEach((c) => {
    const y = c.y + 12 * Math.sin(a + c.ph);
    c.el.style.transform = "translate(-50%,-50%) translate3d(" + c.x + "px," + y.toFixed(2) + "px,40px)";
  });
}

window.SCENE = { w: S.w, h: S.h, T: S.T };
window.ready = Promise.all([
  document.fonts.ready,
  ...devices.flatMap((d) => d.imgs.map((img) => img.decode())),
]).then(() => { render(0); return true; });

if (params.has("play")) {
  const t0 = performance.now();
  (function loop(now) { render(((now - t0) / 1000) % S.T); requestAnimationFrame(loop); })(t0);
}
</script>
</body>
</html>
